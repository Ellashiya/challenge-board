<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>챌린지 보드</title>
<meta name="description" content="매일 할 일과 미션을 기록하고 집계하는 취업 준비 챌린지 보드">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <div class="top-inner">
    <h1>챌린지 보드</h1>
    <p id="today-label" class="today-label"></p>
    <div id="calendar" class="calendar" aria-label="달력" hidden></div>
  </div>
</header>

<main id="view"></main>

<nav class="bottom-nav" aria-label="메뉴">
  <button type="button" data-nav="missions"><span class="ico">🎯</span><span>미션</span></button>
  <button type="button" data-nav="home" class="home-btn"><span class="ico">🏠</span><span>홈</span></button>
  <button type="button" data-nav="settings"><span class="ico">⚙️</span><span>설정</span><i class="dot" id="backup-dot" hidden></i></button>
</nav>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="confetti" class="confetti" aria-hidden="true"></div>

<script type="module" src="app.js"></script>
</body>
</html>
